spring.application.name=app

# JWT (set JWT_SECRET in production — must be at least 256 bits for HS256)
app.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}

# Neon (Postgres) connection (set via environment variables)
# Example:
#   JDBC_DATABASE_URL=jdbc:postgresql://<host>/<db>?sslmode=require&channel_binding=require
#   DB_USERNAME=<user>
#   DB_PASSWORD=<password>
spring.datasource.url=${JDBC_DATABASE_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Auto-create/update tables on Postgres (Neon) at startup.
# Use Flyway/Liquibase instead if you want controlled migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
