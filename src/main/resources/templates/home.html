<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Home Ledger — Home</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --border: #2d3a4d;
            --text: #e8eef5;
            --muted: #8b9cb3;
            --accent: #3d8bfd;
            --accent-hover: #5aa0ff;
            --danger: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: rgba(26, 35, 50, 0.85);
            backdrop-filter: blur(8px);
        }
        .greeting {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .greeting span { color: var(--accent); }
        .topbar-actions { display: flex; align-items: center; gap: 0.75rem; }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-ghost {
            background: transparent;
            color: var(--text);
            border-color: var(--border);
        }
        .btn-ghost:hover { background: #222d3d; border-color: var(--muted); }
        .btn-danger {
            background: transparent;
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.35);
        }
        .btn-danger:hover { background: rgba(248, 113, 113, 0.10); border-color: rgba(248, 113, 113, 0.6); }
        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 1.75rem 1.5rem 2.5rem;
        }
        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .section-head h1 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--muted);
        }
        .project-list {
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
        }
        .project-list li {
            padding: 0.9rem 1.1rem;
            border-bottom: 1px solid var(--border);
        }
        .project-list li:last-child { border-bottom: none; }
        .project-list .name { font-weight: 500; }
        a.project-link {
            color: inherit;
            text-decoration: none;
            display: block;
        }
        a.project-link:hover { color: var(--accent); }
        .project-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }
        .project-actions { display: flex; align-items: center; gap: 0.5rem; }
        .flash {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            margin: 0 0 1rem;
            background: rgba(26, 35, 50, 0.6);
            color: var(--text);
        }
        .flash.error { border-color: rgba(248, 113, 113, 0.35); }
        .flash.success { border-color: rgba(61, 139, 253, 0.35); }
        .empty {
            text-align: center;
            padding: 2rem 1.25rem;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 12px;
            background: rgba(26, 35, 50, 0.5);
        }
        dialog {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0;
            background: var(--card);
            color: var(--text);
            max-width: 100%;
            width: min(400px, calc(100vw - 2rem));
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
        }
        dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
        .dialog-inner { padding: 1.35rem 1.5rem 1.5rem; }
        .dialog-inner h2 { margin: 0 0 1rem; font-size: 1.1rem; }
        .dialog-inner label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.35rem;
        }
        .dialog-inner input[type="text"] {
            width: 100%;
            padding: 0.65rem 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #131c28;
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 0.35rem;
        }
        .dialog-inner input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(61, 139, 253, 0.2);
        }
        .field-err { color: var(--danger); font-size: 0.8rem; margin: 0 0 1rem; }
        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-top: 1.1rem;
        }
    </style>
</head>
<body>
<header class="topbar">
    <p class="greeting">Hi <span th:text="${username}">User</span></p>
    <div class="topbar-actions">
        <form th:action="@{/web/logout}" method="post" style="margin:0;">
            <button type="submit" class="btn btn-ghost">Log out</button>
        </form>
    </div>
</header>

<main>
    <div class="flash error" th:if="${error != null and !#strings.isEmpty(error)}" th:text="${error}">Error</div>
    <div class="flash success" th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}">Message</div>

    <div class="section-head">
        <h1>Your projects</h1>
        <button type="button" class="btn btn-primary" id="openCreateProject">Create project</button>
    </div>

    <ul class="project-list" th:if="${projects != null and !projects.isEmpty()}">
        <li th:each="p : ${projects}">
            <div class="project-row">
                <a class="project-link name" th:href="@{/web/projects/{id}(id=${p.projectId})}" th:text="${p.projectName}">Project</a>
                <div class="project-actions">
                    <form th:action="@{/web/projects/{id}/delete(id=${p.projectId})}" method="post" style="margin:0;"
                          onsubmit="return confirm('Delete this project? This cannot be undone.');">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </li>
    </ul>
    <p class="empty" th:if="${projects == null or projects.isEmpty()}">No projects yet. Create one to get started.</p>
</main>

<dialog id="createProjectDialog" th:open="${projectFormOpen == true}">
    <div class="dialog-inner">
        <h2>New project</h2>
        <form th:action="@{/web/projects}" th:object="${projectForm}" method="post">
            <label for="projectName">Project name</label>
            <input id="projectName" type="text" th:field="*{projectName}" maxlength="255" placeholder="Name" autocomplete="off"/>
            <p class="field-err" th:if="${#fields.hasErrors('projectName')}" th:errors="*{projectName}"></p>
            <div class="dialog-actions">
                <button type="submit" class="btn btn-primary">Create</button>
                <button type="button" class="btn btn-ghost" id="closeCreateProject">Cancel</button>
            </div>
        </form>
    </div>
</dialog>

<script>
    (function () {
        var dlg = document.getElementById('createProjectDialog');
        var openBtn = document.getElementById('openCreateProject');
        var closeBtn = document.getElementById('closeCreateProject');
        if (openBtn && dlg && typeof dlg.showModal === 'function') {
            openBtn.addEventListener('click', function () { dlg.showModal(); });
        }
        if (closeBtn && dlg) {
            closeBtn.addEventListener('click', function () { dlg.close(); });
        }
    })();
</script>
</body>
</html>
