<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Home Ledger — Sign in</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --border: #2d3a4d;
            --text: #e8eef5;
            --muted: #8b9cb3;
            --accent: #3d8bfd;
            --accent-hover: #5aa0ff;
            --danger: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(ellipse 120% 80% at 50% -20%, #1e3a5f 0%, var(--bg) 55%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 2rem 2rem 1.75rem;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
        }
        h1 {
            margin: 0 0 0.35rem;
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .subtitle { margin: 0 0 1.5rem; color: var(--muted); font-size: 0.9rem; }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 0.35rem;
        }
        input[type="text"], input[type="password"], input[type="tel"] {
            width: 100%;
            padding: 0.65rem 0.75rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #131c28;
            color: var(--text);
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(61, 139, 253, 0.2);
        }
        .err {
            color: var(--danger);
            font-size: 0.85rem;
            margin: -0.5rem 0 1rem;
        }
        .field-err { color: var(--danger); font-size: 0.8rem; margin: -0.75rem 0 0.75rem; }
        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.25rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button[type="submit"]:hover { background: var(--accent-hover); }
        .signup-row {
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            text-align: center;
        }
        .signup-row span { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 0.65rem; }
        a.signup {
            display: inline-block;
            width: 100%;
            padding: 0.65rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.15s, border-color 0.15s;
        }
        a.signup:hover {
            background: #222d3d;
            border-color: var(--muted);
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in with your phone number and password.</p>

    <p class="err" th:if="${error}" th:text="${error}">Error</p>

    <form th:action="@{/web/login}" th:object="${loginRequest}" method="post" novalidate>
        <label for="phoneNumber">Phone number</label>
        <input id="phoneNumber" type="tel" th:field="*{phoneNumber}" autocomplete="tel" maxlength="10" placeholder="10-digit number"/>
        <p class="field-err" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>

        <label for="password">Password</label>
        <input id="password" type="password" th:field="*{password}" autocomplete="current-password"/>
        <p class="field-err" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <button type="submit">Log in</button>
    </form>

    <div class="signup-row">
        <span>New here?</span>
        <a class="signup" th:href="@{/signup}">Create an account</a>
    </div>
</div>
</body>
</html>
