services:
  - type: web
    name: myhomeledger
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: JPA_DDL_AUTO
        value: update
